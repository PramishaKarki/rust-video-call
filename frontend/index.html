
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Video Caller</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: blue;
        }

        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .video-box {
            background-color: gray;
            color: white;
            width: 300px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: lightblue;
            color: white;
        }

        button:disabled {
            opacity: 0.65;
        }
    </style>
</head>

<body>
    <h1>Rust Video Caller</h1>

    <div class="video-container">
        <div class="video-box">Your Video</div>
        <div class="video-box">User 2 Video</div>
    </div>

    <div>
        <button style="background-color: green;" onclick="startCall()">Start Call</button>
        <button onclick="cameraOff()">Camera Off</button>
        <button onclick="mute()">Mute</button>
        <button style="background-color: red;" onclick="endCall()">End Call</button>
    </div>

    <p>Status: Interface preview (not connected)</p>
</body>
</html>
